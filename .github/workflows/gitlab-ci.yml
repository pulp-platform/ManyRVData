name: gitlab-ci

on: [ push, pull_request, workflow_dispatch ]

jobs:
  lint-license:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v3
    -
      name: Check license
      uses: pulp-platform/pulp-actions/lint-license@v2
      with:
        license: |
          Copyright (\d{4}(-\d{4})?\s)?(ETH Zurich and University of Bologna|lowRISC contributors).
          (Solderpad Hardware License, Version 0.51|Licensed under the Apache License, Version 2.0), see LICENSE for details.
          SPDX-License-Identifier: (SHL-0.51|Apache-2.0)
        # Exclude generated headers (no license checker support for optional lines)
        exclude_paths: |
          software/*
          util/*
          docs/*
          install/*
          config/*
          hardware/tb/dpi/*
          hardware/tb/dram_config/*
          hardware/bootrom/*
          Bender.lock
          .gitignore

  lint-style:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v3
      with:
        # Full history, so the merge-base with the base branch is available
        fetch-depth: 0
    -
      name: Check RTL coding style on changed lines
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        # Same check as the pre-commit hook: only lines changed by this PR/push are reported.
        if [ "$EVENT" = "pull_request" ]; then
          base="origin/$BASE_REF"
        elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          base="$BEFORE"
        else
          base="origin/main"
        fi
        echo "Checking lines changed since merge-base with $base"
        python3 util/lint/script/rtl_style_check.py scan --changed-since "$base"

  lint-sv:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v3
    -
      name: Run Verible
      uses: chipsalliance/verible-linter-action@main
      with:
        paths: hardware
        github_token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_error: false
        reviewdog_reporter: github-check

  gitlab-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check Gitlab CI
        uses: pulp-platform/pulp-actions/gitlab-ci@v2.4.1 
        if: github.repository == 'pulp-platform/ManyRVData' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          domain: iis-git.ee.ethz.ch
          repo: github-mirror/ManyRVData
          token: ${{ secrets.GITLAB_TOKEN }}
