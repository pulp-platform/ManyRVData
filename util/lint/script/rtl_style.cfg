# Configuration of rtl_style_check.py.

[scope]
# Files to check, relative to the repo root. Gitignore-like: the last matching
# pattern wins, and a leading `!` excludes. Testbenches, monitors and generated
# files are out of scope.
paths =
    hardware/**/*.sv
    hardware/**/*.svh
    !hardware/tb/**
    hardware/tb/cachepool_cluster_wrapper.sv
    !hardware/src/verif/**
    !hardware/bootrom/**
    !hardware/generated/**
    !hardware/deps/**
    !hardware/cachepool_peripheral/*_reg_*.sv

[rules]
# Severity per rule: error (fails), warning (reported only) or off.
BLOCKING_IN_FF   = error
FF_NO_RESET      = error
UNPACKED_STRUCT  = error
AUTOMATIC        = error
EOL_COMMENT      = error
COMMENT_BLOCK    = error
INDENT_TAB       = error
INDENT_ODD       = error
PORT_NAMING      = error
DEBUG_PROBE      = error
DEBUG_UNGUARDED  = error
WAIVER_NO_REASON = warning

[options]
indent            = 2
comment_max_lines = 3
# Identifiers that count as a reset in an always_ff sensitivity list or reset branch.
reset_pattern     = (?i)rst|reset
# `ifdef/`ifndef macros that mark a debug-only region.
debug_macro_pattern = (?i)debug
# Code under `ifndef <macro> is simulation-only: the comb/seq rules are relaxed there,
# the debug-probe and formatting rules still apply.
nonsynth_if_undefined = TARGET_SYNTHESIS SYNTHESIS
# Code under `ifdef <macro> is simulation-only.
nonsynth_if_defined   = TARGET_SIMULATION VERILATOR
# Tool directives that are allowed as end-of-line comments.
pragma_pattern = ^\s*(verilator|spyglass|synopsys|pragma|synthesis|cadence|verible|lint)\b
